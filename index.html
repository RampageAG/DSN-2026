<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="DSN26 Schedule" />
  <meta name="theme-color" content="#0f172a" />
  <title>Dragonsteel Nexus 2026 — Event Schedule</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-hover: #273549;
      --surface-alt: #162032;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.14);
      --green: #34d399;
      --green-soft: rgba(52, 211, 153, 0.14);
      --amber: #fbbf24;
      --amber-soft: rgba(251, 191, 36, 0.15);
      --red: #f87171;
      --red-soft: rgba(248, 113, 113, 0.14);
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
      padding-bottom: 84px;
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .header-top {
      max-width: 820px;
      margin: 0 auto;
      padding: 14px 16px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .title-group h1 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--text);
    }

    .title-group p {
      margin: 2px 0 0;
      font-size: 0.78rem;
      color: var(--accent);
      font-weight: 500;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 7px 11px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: background 0.15s;
    }

    .icon-btn:hover {
      background: var(--surface-hover);
    }

    /* Strict 3-Day Tabs */
    .day-tabs {
      max-width: 820px;
      margin: 0 auto;
      padding: 0 12px 10px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .day-tab {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 10px;
      padding: 8px 4px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }

    .day-tab span {
      display: block;
      font-size: 0.68rem;
      font-weight: 400;
      opacity: 0.85;
      margin-top: 1px;
    }

    .day-tab.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Search & Filters */
    .controls {
      max-width: 820px;
      margin: 12px auto 0;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .search-row {
      display: flex;
      gap: 8px;
    }

    .search-input-wrap {
      position: relative;
      flex: 1;
    }

    .search-input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 9px 32px 9px 12px;
      font-size: 0.9rem;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    .clear-search {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1rem;
      cursor: pointer;
      display: none;
      padding: 2px 6px;
    }

    .filter-select {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 9px 10px;
      font-size: 0.82rem;
      max-width: 155px;
      outline: none;
    }

    .tag-strip {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .tag-strip::-webkit-scrollbar {
      display: none;
    }

    .tag-chip {
      white-space: nowrap;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 999px;
      padding: 4px 11px;
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }

    .tag-chip.active {
      background: var(--green-soft);
      border-color: var(--green);
      color: var(--green);
      font-weight: 600;
    }

    /* Main Content */
    main {
      max-width: 820px;
      margin: 10px auto 0;
      padding: 0 16px;
    }

    .stats-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 10px;
      padding: 0 2px;
    }

    .day-divider {
      margin: 18px 0 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--accent);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .event-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .event-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      transition: border-color 0.15s, background 0.15s;
      position: relative;
    }

    .event-card.selected {
      border-color: var(--green);
      background: linear-gradient(180deg, rgba(52, 211, 153, 0.06) 0%, var(--surface) 100%);
    }



    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .time-badge {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 3px 8px;
      border-radius: 6px;
      display: inline-block;
      margin-bottom: 6px;
    }



    .event-title {
      margin: 0;
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.3;
    }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      margin-top: 7px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .meta-item {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .guests-box {
      margin-top: 8px;
      font-size: 0.8rem;
      color: #cbd5e1;
      background: var(--surface-alt);
      padding: 6px 10px;
      border-radius: 8px;
      border-left: 3px solid var(--accent);
    }

    .event-desc {
      margin-top: 9px;
      font-size: 0.85rem;
      color: #cbd5e1;
      white-space: pre-line;
    }

    .event-desc.collapsed {
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .expand-btn {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 600;
      padding: 4px 0 0;
      cursor: pointer;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(51, 65, 85, 0.6);
      flex-wrap: wrap;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .mini-tag {
      font-size: 0.7rem;
      color: var(--text-muted);
      background: var(--surface-alt);
      border: 1px solid var(--border);
      padding: 2px 8px;
      border-radius: 6px;
    }

    .toggle-btn {
      border-radius: 9px;
      padding: 7px 13px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
      transition: all 0.15s;
      white-space: nowrap;
    }

    .toggle-btn.saved {
      border-color: var(--red);
      background: var(--red-soft);
      color: var(--red);
    }

    .empty-state {
      text-align: center;
      padding: 42px 20px;
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      color: var(--text-muted);
    }

    .empty-state h3 {
      margin: 0 0 6px;
      color: var(--text);
      font-size: 1rem;
    }

    /* Bottom Navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 35;
      background: rgba(15, 23, 42, 0.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    }

    .bottom-nav-inner {
      max-width: 820px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .nav-mode-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 11px;
      padding: 10px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: all 0.15s;
    }

    .nav-mode-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #0f172a;
    }

    .badge-count {
      background: rgba(15, 23, 42, 0.25);
      padding: 1px 7px;
      border-radius: 999px;
      font-size: 0.76rem;
    }

    .nav-mode-btn:not(.active) .badge-count {
      background: var(--green-soft);
      color: var(--green);
    }
	
	/* Daily Calendar Time Grid Styles */
    .cal-grid {
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      margin-top: 10px;
    }

    .cal-day-header {
      padding: 12px 16px;
      background: var(--surface-alt);
      border-bottom: 1px solid var(--border);
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--accent);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

.cal-hours-container {
      position: relative;
      max-height: 650px;
      overflow-y: auto;
    }
	
    .cal-events-overlay {
      position: absolute;
      top: 0;
      left: 75px;
      right: 0;
      bottom: 0;
      pointer-events: none;
      height: 100%;
    }

    .cal-hour-row {
      display: flex;
      height: 60px;
      border-bottom: 1px solid rgba(51, 65, 85, 0.4);
    }

    .cal-time-label {
      width: 75px;
      padding: 6px 8px;
      font-size: 0.72rem;
      color: var(--text-muted);
      text-align: right;
      border-right: 1px solid var(--border);
      flex-shrink: 0;
    }

    .cal-hour-slot {
      flex: 1;
      position: relative;
    }

	.cal-event-block {
	  pointer-events: auto;
      position: absolute;
      background: var(--accent-soft);
      border-left: 4px solid var(--accent);
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 0.78rem;
      overflow: hidden;
      cursor: pointer;
      transition: background 0.15s;
      z-index: 2;
      box-sizing: border-box;
    }

    .cal-event-block:hover {
      background: rgba(56, 189, 248, 0.25);
      z-index: 10;
    }

    .cal-event-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 4px;
    }

    .cal-remove-btn {
      background: none;
      border: none;
      color: var(--red);
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      padding: 0 3px;
      border-radius: 4px;
      line-height: 1;
    }

    .cal-remove-btn:hover {
      background: var(--red-soft);
    }

    .cal-event-block .event-title {
      font-size: 0.82rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin: 0;
    }

    .cal-event-block .cal-event-time {
      font-size: 0.7rem;
      color: var(--accent);
      font-weight: 600;
    }

    .cal-event-block .cal-event-loc {
      font-size: 0.68rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
	
	/* Event Detail Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(15, 23, 42, 0.82);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      max-width: 600px;
      width: 100%;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }

    .modal-header {
      padding: 14px 18px;
      background: var(--surface-alt);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .modal-back-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .modal-back-btn:hover {
      background: var(--surface-hover);
    }

    .modal-body {
      padding: 18px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .modal-footer {
      padding: 14px 18px;
      background: var(--surface-alt);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    /* Make event titles look interactive */
    .clickable-title {
      cursor: pointer;
      transition: color 0.15s;
    }

    .clickable-title:hover {
      color: var(--accent);
      text-decoration: underline;
    }
  </style>
</head>

<header>
  <div class="header-top">
    <div class="title-group">
      <h1>Dragonsteel Nexus 2026</h1>
      <p>Dec 3 – Dec 5, 2026 • Official Schedule</p>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="exportIcsBtn" title="Download My Schedule (.ics)">📅 Export .ics</button>
    </div>
  </div>
  <div class="day-tabs" id="dayTabs">
    <button class="day-tab active" data-day="2026-12-03">Thu<span>Dec 3</span></button>
    <button class="day-tab" data-day="2026-12-04">Fri<span>Dec 4</span></button>
    <button class="day-tab" data-day="2026-12-05">Sat<span>Dec 5</span></button>
    <button class="day-tab" data-day="ALL">All Days<span>Dec 3–5</span></button>
  </div>
</header>

<div class="controls">
  <div class="search-row">
    <div class="search-input-wrap">
      <input type="text" id="searchInput" class="search-input" placeholder="Search events, guests, rooms..." />
      <button class="clear-search" id="clearSearchBtn" aria-label="Clear search">✕</button>
    </div>
    <select id="locationFilter" class="filter-select" aria-label="Filter by Room">
      <option value="ALL">All Rooms</option>
    </select>
  </div>
  <div class="tag-strip" id="tagStrip"></div>
</div>

<main>
  <div class="stats-bar">
    <span id="resultsCount">Loading schedule...</span>
    <span id="conflictSummary" style="color: var(--amber); font-weight: 600;"></span>
  </div>
  <div id="eventsContainer"></div>
</main>

<div class="modal-backdrop" id="eventModal">
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-header">
      <button class="modal-back-btn" id="modalCloseBtn">← Return to Schedule</button>
      <span class="time-badge" id="modalTimeBadge" style="margin: 0;"></span>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<nav class="bottom-nav">
  <div class="bottom-nav-inner">
    <button class="nav-mode-btn active" id="modeBrowseBtn">Browse Schedule</button>
    <button class="nav-mode-btn" id="modeMyBtn">My Calendar <span class="badge-count" id="savedCountBadge">0</span></button>
  </div>
</nav>

  const DAY_LABELS = {
    "2026-12-03": "Thursday, December 3, 2026",
    "2026-12-04": "Friday, December 4, 2026",
    "2026-12-05": "Saturday, December 5, 2026"
  };

  // Assign deterministic IDs
  const EVENTS = DEFAULT_EVENTS_DATA.map((ev, idx) => ({
    ...ev,
    id: `dsn26-${idx}-${ev.Day}-${ev["Start Time"]}-${ev.Name}`.replace(/[^a-zA-Z0-9-_]/g, '_')
  }));

  const STORAGE_KEY = "dsn2026_my_schedule_v1";
  let savedIds = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"));

  let state = {
    mode: "BROWSE", // "BROWSE" | "MY"
    day: "2026-12-03",
    search: "",
    location: "ALL",
    tag: "ALL",
    expandedDesc: new Set()
  };

  function saveToStorage() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify([...savedIds]));
    document.getElementById("savedCountBadge").textContent = savedIds.size;
  }

  function parseTimeToMinutes(timeStr) {
    if (!timeStr) return 0;
    const match = timeStr.trim().match(/^(\d{1,2}):(\d{2})\s*(AM|PM)$/i);
    if (!match) return 0;
    let hours = parseInt(match[1], 10);
    const minutes = parseInt(match[2], 10);
    const period = match[3].toUpperCase();
    if (period === "PM" && hours !== 12) hours += 12;
    if (period === "AM" && hours === 12) hours = 0;
    return hours * 60 + minutes;
  }

  function getConflicts() {
    return new Set(); // Overlapping time slots are fully permitted without warnings
  }

  function populateFilters() {
    const locSelect = document.getElementById("locationFilter");
    const locations = [...new Set(EVENTS.map(e => e.Location).filter(Boolean))].sort();
    locations.forEach(loc => {
      const opt = document.createElement("option");
      opt.value = loc;
      opt.textContent = loc;
      locSelect.appendChild(opt);
    });

    const tagSet = new Set();
    EVENTS.forEach(e => {
      if (e.Tags) {
        e.Tags.split(",").map(t => t.trim()).filter(Boolean).forEach(t => tagSet.add(t));
      }
    });
    const tags = ["ALL", ...[...tagSet].sort()];
    const tagStrip = document.getElementById("tagStrip");
    tagStrip.innerHTML = "";
    tags.forEach(tag => {
      const btn = document.createElement("button");
      btn.className = "tag-chip" + (state.tag === tag ? " active" : "");
      btn.textContent = tag === "ALL" ? "All Topics" : tag;
      btn.onclick = () => {
        state.tag = tag;
        document.querySelectorAll(".tag-chip").forEach(c => c.classList.remove("active"));
        btn.classList.add("active");
        render();
      };
      tagStrip.appendChild(btn);
    });
  }

  function escapeHtml(str) {
    return String(str || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  const eventModal = document.getElementById("eventModal");
  const modalCloseBtn = document.getElementById("modalCloseBtn");

  function closeEventModal() {
    eventModal.classList.remove("open");
  }

  modalCloseBtn.addEventListener("click", closeEventModal);
  eventModal.addEventListener("click", (e) => {
    if (e.target === eventModal) closeEventModal();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && eventModal.classList.contains("open")) {
      closeEventModal();
    }
  });

  function openEventModal(eventId) {
    const ev = EVENTS.find(e => e.id === eventId);
    if (!ev) return;

    const isSaved = savedIds.has(ev.id);
    const tagsList = (ev.Tags || "").split(",").map(t => t.trim()).filter(Boolean);

    document.getElementById("modalTimeBadge").textContent = `${ev["Start Time"]} – ${ev["End Time"]}`;

    document.getElementById("modalBody").innerHTML = `
      <h2 id="modalTitle" style="margin: 0; font-size: 1.25rem; line-height: 1.3;">${escapeHtml(ev.Name)}</h2>
      <div class="meta-row" style="margin-top: 0;">
        <span class="meta-item">🗓 ${DAY_LABELS[ev.Day]}</span>
        ${ev.Location ? `<span class="meta-item">📍 ${escapeHtml(ev.Location)}</span>` : ""}
      </div>
      ${ev["Featured Guests"] ? `
        <div class="guests-box" style="margin-top: 4px;">
          <strong>Featured Guests:</strong> ${escapeHtml(ev["Featured Guests"])}
        </div>
      ` : ""}
      ${ev.Description ? `
        <div class="event-desc" style="margin-top: 4px;">${formatDescription(ev.Description)}</div>
      ` : `<p style="color: var(--text-muted); font-size: 0.85rem; margin: 4px 0;">No additional description provided.</p>`}
      ${tagsList.length ? `
        <div class="card-tags" style="margin-top: 6px;">
          ${tagsList.map(t => `<span class="mini-tag">${escapeHtml(t)}</span>`).join("")}
        </div>
      ` : ""}
    `;

    const footer = document.getElementById("modalFooter");
    footer.innerHTML = `
      <button class="toggle-btn ${isSaved ? "saved" : ""}" id="modalToggleBtn">
        ${isSaved ? "✕ Remove from Calendar" : "+ Add to Calendar"}
      </button>
    `;

    document.getElementById("modalToggleBtn").onclick = () => {
      if (savedIds.has(ev.id)) {
        savedIds.delete(ev.id);
      } else {
        savedIds.add(ev.id);
      }
      saveToStorage();
      render();
      openEventModal(ev.id); // Refresh the modal button state immediately
    };

    eventModal.classList.add("open");
  }

function render() {
    const container = document.getElementById("eventsContainer");
    const q = state.search.toLowerCase().trim();

    // If we are in "MY" calendar mode, render the Google Calendar-style daily time grid with side-by-side collisions
    if (state.mode === "MY") {
      const savedEvents = EVENTS.filter(ev => savedIds.has(ev.id));
      document.getElementById("resultsCount").textContent =
        `${savedEvents.length} event${savedEvents.length === 1 ? "" : "s"} in your calendar`;

      if (savedEvents.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <h3>No events in your calendar yet</h3>
            <p>Switch to Browse Schedule and tap + Add to Calendar on any panel, workshop, or game session.</p>
          </div>
        `;
        return;
      }

      const days = ["2026-12-03", "2026-12-04", "2026-12-05"];
      let html = "";

      days.forEach(dayKey => {
        const dayEvents = savedEvents.filter(e => e.Day === dayKey);
        if (dayEvents.length === 0) return;

        dayEvents.sort((a, b) => parseTimeToMinutes(a["Start Time"]) - parseTimeToMinutes(b["Start Time"]));

        const totalHours = 22 - 9 + 1; // 9 AM to 22 PM
        const totalHeight = totalHours * 60; // 60px per hour

        html += `
          <div class="cal-grid" data-day="${dayKey}">
            <div class="cal-day-header">
              <span>${DAY_LABELS[dayKey]}</span>
              <span style="font-size: 0.8rem; font-weight: normal; color: var(--text-muted);">${dayEvents.length} events</span>
            </div>
            <div class="cal-hours-container" style="height: ${totalHeight}px;">
              <div class="cal-events-overlay"></div>
        `;

        const startHour = 9;
        const endHour = 22;

        for (let h = startHour; h <= endHour; h++) {
          const displayHour = h === 12 ? "12 PM" : h > 12 ? `${h - 12} PM` : `${h} AM`;
          html += `
            <div class="cal-hour-row">
              <div class="cal-time-label">${displayHour}</div>
              <div class="cal-hour-slot" data-hour="${h}"></div>
            </div>
          `;
        }

        html += `</div></div>`;
      });

      container.innerHTML = html;

      // Inject event blocks into each day's overlay with overlap layout calculation
      days.forEach(dayKey => {
        const dayEvents = savedEvents.filter(e => e.Day === dayKey);
        if (dayEvents.length === 0) return;

        const targetGrid = container.querySelector(`.cal-grid[data-day="${dayKey}"]`);
        if (!targetGrid) return;

        const eventsOverlay = targetGrid.querySelector(".cal-events-overlay");

        // Map events with computed minutes
        const mappedEvents = dayEvents.map(ev => ({
          ...ev,
          startMins: parseTimeToMinutes(ev["Start Time"]),
          endMins: parseTimeToMinutes(ev["End Time"])
        }));

        // Compute overlap columns
        const columns = [];
        mappedEvents.forEach(ev => {
          let placed = false;
          for (let col of columns) {
            let overlap = false;
            for (let existing of col) {
              if (ev.startMins < existing.endMins && ev.endMins > existing.startMins) {
                overlap = true;
                break;
              }
            }
            if (!overlap) {
              col.push(ev);
              ev._col = columns.indexOf(col);
              placed = true;
              break;
            }
          }
          if (!placed) {
            columns.push([ev]);
            ev._col = columns.length - 1;
          }
        });

        const totalCols = Math.max(1, columns.length);

        mappedEvents.forEach(ev => {
          const durationMins = Math.max(30, ev.endMins - ev.startMins);
          const dayStartMins = 9 * 60;
          const topPx = ((ev.startMins - dayStartMins) / 60) * 60;
          const heightPx = (durationMins / 60) * 60;

          const colWidth = 100 / totalCols;
          const leftPct = ev._col * colWidth;

          if (topPx >= 0) {
            const block = document.createElement("div");
            block.className = "cal-event-block";
            block.style.top = `${topPx}px`;
            block.style.height = `${heightPx}px`;
            block.style.left = `calc(${leftPct}% + 4px)`;
            block.style.width = `calc(${colWidth}% - 8px)`;

		  block.innerHTML = `
              <div class="cal-event-header-row">
                <div class="cal-event-time">${escapeHtml(ev["Start Time"])} – ${escapeHtml(ev["End Time"])}</div>
                <button class="cal-remove-btn" title="Remove from Calendar" data-remove-id="${ev.id}">✕</button>
              </div>
              <h4 class="event-title clickable-title" data-open-id="${ev.id}">${escapeHtml(ev.Name)}</h4>
              ${ev.Location ? `<div class="cal-event-loc">${escapeHtml(ev.Location)}</div>` : ""}
            `;

            block.querySelector("[data-open-id]").onclick = (e) => {
              e.stopPropagation();
              openEventModal(ev.id);
            };

            block.querySelector(".cal-remove-btn").onclick = (e) => {
              e.stopPropagation();
              savedIds.delete(ev.id);
              saveToStorage();
              render();
            };

            eventsOverlay.appendChild(block);
          }
        });
      });

      return;
    }

    // --- Standard BROWSE Mode Filtering & Rendering ---
    const conflictIds = getConflicts();
    let filtered = EVENTS.filter(ev => {
      if (state.day !== "ALL" && ev.Day !== state.day) return false;
      if (state.location !== "ALL" && ev.Location !== state.location) return false;
      if (state.tag !== "ALL") {
        const evTags = (ev.Tags || "").split(",").map(t => t.trim());
        if (!evTags.includes(state.tag)) return false;
      }
      if (q) {
        const hay = `${ev.Name} ${ev["Featured Guests"]} ${ev.Location} ${ev.Description} ${ev.Tags}`.toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });

    // Sort by Day, then Start Time, then Name
    filtered.sort((a, b) => {
      if (a.Day !== b.Day) return a.Day.localeCompare(b.Day);
      const tDiff = parseTimeToMinutes(a["Start Time"]) - parseTimeToMinutes(b["Start Time"]);
      if (tDiff !== 0) return tDiff;
      return a.Name.localeCompare(b.Name);
    });

    document.getElementById("resultsCount").textContent =
      `${filtered.length} event${filtered.length === 1 ? "" : "s"} shown`;

    if (filtered.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <h3>No matching events found</h3>
          <p>Try clearing your search or switching day/room filters.</p>
        </div>
      `;
      return;
    }

    const daysToRender = state.day === "ALL"
      ? ["2026-12-03", "2026-12-04", "2026-12-05"]
      : [state.day];

    let html = "";
    daysToRender.forEach(dayKey => {
      const dayEvents = filtered.filter(e => e.Day === dayKey);
      if (dayEvents.length === 0) return;

      if (state.day === "ALL") {
        html += `<div class="day-divider"><span>${DAY_LABELS[dayKey]}</span><span>${dayEvents.length}</span></div>`;
      }

      html += `<div class="event-list">`;
      dayEvents.forEach(ev => {
        const isSaved = savedIds.has(ev.id);
        const isExpanded = state.expandedDesc.has(ev.id);
        const tagsList = (ev.Tags || "").split(",").map(t => t.trim()).filter(Boolean);
        const longDesc = ev.Description && ev.Description.length > 180;

        html += `
          <article class="event-card ${isSaved ? "selected" : ""} ">
            <div>
              <span class="time-badge">${escapeHtml(ev["Start Time"])} – ${escapeHtml(ev["End Time"])}</span>
              <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 10px;">
                <h2 class="event-title clickable-title" data-open-id="${ev.id}" style="margin: 0;">${escapeHtml(ev.Name)}</h2>
                ${ev.Location ? `<span style="font-size: 0.82rem; color: var(--text-muted); white-space: nowrap;">${escapeHtml(ev.Location)}</span>` : ""}
              </div>
            </div>

            <div class="meta-row">
              ${state.day === "ALL" ? `<span class="meta-item">🗓 ${DAY_LABELS[ev.Day].split(",")[0]}</span>` : ""}
            </div>

            ${ev["Featured Guests"] ? `
              <div class="guests-box">
                <strong>Guests:</strong> ${escapeHtml(ev["Featured Guests"])}
              </div>
            ` : ""}

            ${ev.Description ? `
              <div class="event-desc ${longDesc && !isExpanded ? "collapsed" : ""}">${escapeHtml(ev.Description)}</div>
              ${longDesc ? `<button class="expand-btn" data-expand-id="${ev.id}">${isExpanded ? "Show less" : "Read more..."}</button>` : ""}
            ` : ""}

            <div class="card-footer">
              <div class="card-tags">
                ${tagsList.map(t => `<span class="mini-tag">${escapeHtml(t)}</span>`).join("")}
              </div>
              <button class="toggle-btn ${isSaved ? "saved" : ""}" data-toggle-id="${ev.id}">
                ${isSaved ? "✕ Remove from Calendar" : "+ Add to Calendar"}
              </button>
            </div>
          </article>
        `;
      });
      html += `</div>`;
    });

    container.innerHTML = html;

    // Bind toggle buttons
    container.querySelectorAll("[data-toggle-id]").forEach(btn => {
      btn.onclick = () => {
        const id = btn.getAttribute("data-toggle-id");
        if (savedIds.has(id)) {
          savedIds.delete(id);
        } else {
          savedIds.add(id);
        }
        saveToStorage();
        render();
      };
    });

    // Bind expand buttons
    container.querySelectorAll("[data-expand-id]").forEach(btn => {
      btn.onclick = () => {
        const id = btn.getAttribute("data-expand-id");
        if (state.expandedDesc.has(id)) {
          state.expandedDesc.delete(id);
        } else {
          state.expandedDesc.add(id);
        }
        render();
      };
    });

	// Bind clickable titles to open event detail modal
    container.querySelectorAll("[data-open-id]").forEach(el => {
      el.onclick = () => {
        openEventModal(el.getAttribute("data-open-id"));
      };
    });
  }

    function exportToIcs() {
    const selected = EVENTS.filter(e => savedIds.has(e.id));
    if (selected.length === 0) {
      alert("Your calendar is empty! Add at least one event before exporting.");
      return;
    }

    function formatIcsDate(dayStr, timeStr) {
      const cleanDate = dayStr.replace(/-/g, "");
      const mins = parseTimeToMinutes(timeStr);
      const hh = String(Math.floor(mins / 60)).padStart(2, "0");
      const mm = String(mins % 60).padStart(2, "0");
      return cleanDate + "T" + hh + mm + "00";
    }

    function escapeIcsText(str) {
      return String(str || "")
        .replace(/\\/g, "\\\\")
        .replace(/;/g, "\\;")
        .replace(/,/g, "\\,")
        .replace(/\n/g, "\\n");
    }

    let lines = [
      "BEGIN:VCALENDAR",
      "VERSION:2.0",
      "PRODID:-//Dragonsteel Nexus 2026//Schedule App//EN",
      "CALSCALE:GREGORIAN"
    ];

    selected.forEach(ev => {
      const dtStart = formatIcsDate(ev.Day, ev["Start Time"]);
      const dtEnd = formatIcsDate(ev.Day, ev["End Time"]);
      const descParts = [];
      if (ev["Featured Guests"]) descParts.push("Guests: " + ev["Featured Guests"]);
      if (ev.Description) descParts.push(ev.Description);

      lines.push("BEGIN:VEVENT");
      lines.push("UID:" + ev.id + "@dsn2026");
      lines.push("DTSTART:" + dtStart);
      lines.push("DTEND:" + dtEnd);
      lines.push("SUMMARY:" + escapeIcsText(ev.Name));
      if (ev.Location) lines.push("LOCATION:" + escapeIcsText(ev.Location));
      if (descParts.length) lines.push("DESCRIPTION:" + escapeIcsText(descParts.join("\n\n")));
      lines.push("END:VEVENT");
    });

    lines.push("END:VCALENDAR");

	const blob = new Blob([lines.join("\n")], { type: "text/calendar;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "Dragonsteel-Nexus-2026-My-Schedule.ics";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
  // Event Listeners
  document.getElementById("dayTabs").addEventListener("click", (e) => {
    const tab = e.target.closest(".day-tab");
    if (!tab) return;
    state.day = tab.getAttribute("data-day");
    document.querySelectorAll(".day-tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    render();
  });

  const searchInput = document.getElementById("searchInput");
  const clearSearchBtn = document.getElementById("clearSearchBtn");
  searchInput.addEventListener("input", () => {
    state.search = searchInput.value;
    clearSearchBtn.style.display = state.search ? "block" : "none";
    render();
  });

  clearSearchBtn.addEventListener("click", () => {
    searchInput.value = "";
    state.search = "";
    clearSearchBtn.style.display = "none";
    render();
  });

  document.getElementById("locationFilter").addEventListener("change", (e) => {
    state.location = e.target.value;
    render();
  });

  document.getElementById("modeBrowseBtn").addEventListener("click", () => {
    state.mode = "BROWSE";
    document.getElementById("modeBrowseBtn").classList.add("active");
    document.getElementById("modeMyBtn").classList.remove("active");
    render();
  });

  document.getElementById("modeMyBtn").addEventListener("click", () => {
    state.mode = "MY";
    document.getElementById("modeMyBtn").classList.add("active");
    document.getElementById("modeBrowseBtn").classList.remove("active");
    render();
  });

  document.getElementById("exportIcsBtn").addEventListener("click", exportToIcs);

  // Init
  populateFilters();
  saveToStorage();
  render();
</script>
</body>
</html>
